<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Un-Nest Sequences</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: #2b2b2b;
    color: #ddd;
    margin: 0;
    padding: 14px;
    font-size: 12px;
  }
  h1 {
    font-size: 13px;
    margin: 0 0 10px 0;
    color: #fff;
  }
  p {
    line-height: 1.5;
    color: #aaa;
  }
  button {
    width: 100%;
    padding: 10px;
    background: #4a90d9;
    color: white;
    border: none;
    border-radius: 3px;
    font-size: 12px;
    cursor: pointer;
    margin-top: 8px;
  }
  button:hover { background: #5a9fe4; }
  button:disabled { background: #555; cursor: default; }
  #log {
    margin-top: 12px;
    padding: 8px;
    background: #1e1e1e;
    border-radius: 3px;
    height: 100px;
    overflow-y: auto;
    white-space: pre-wrap;
    font-family: Menlo, Consolas, monospace;
    font-size: 11px;
    color: #9c9;
  }
</style>
</head>
<body>
  <h1>Un-Nest Sequences</h1>
  <p>Runs on the ACTIVE sequence. Make sure it's a duplicate before clicking — see the README.</p>
  <button id="runBtn">Run on Active Sequence</button>
  <div id="log">Ready.</div>

  <script src="./CSInterface.js"></script>
  <script src="./main.js"></script>
</body>
</html>
